<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <div class="auth-card">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v12M15 9.5c0-1.4-1.3-2-3-2s-3 .8-3 2 1.3 1.8 3 2 3 .8 3 2.2-1.3 2-3 2-3-.7-3-2"/>
            </svg>
        </div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Please login to your expense tracker</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/login" method="POST">
            <label for="username">USERNAME</label>
            <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/>
                </svg>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <label for="password">PASSWORD</label>
            <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="switch">Don't have an account? <a href="/register">Register</a></p>
    </div>
</body>
</html>
